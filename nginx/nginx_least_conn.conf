events {
    worker_connections 1024;
}

http {
    # =========================================================================
    # Balanceador de Carga ShopNow - Algoritmo 2: Least Connections + Pesos
    # Encaminha para o servidor com menos conexoes ativas considerando o peso.
    # =========================================================================
    upstream shopnow_cluster {
        least_conn;

        server app_server1:8001 weight=3 max_fails=2 fail_timeout=5s;
        server app_server2:8002 weight=2 max_fails=2 fail_timeout=5s;
        server app_server3:8003 weight=1 max_fails=2 fail_timeout=5s;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://shopnow_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Load-Balancer-Algorithm "Nginx Proxy (Least Connections + Weighted)";

            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        }
    }
}

events {
    worker_connections 1024;
}

http {
    # =========================================================================
    # Balanceador de Carga ShopNow - Algoritmo 1: Round Robin (Padrao)
    # Para ativar Least Connections, descomente a linha 'least_conn;' abaixo.
    # Para ativar Weighted Round Robin, ajuste 'weight=3', 'weight=2', 'weight=1'.
    # =========================================================================
    upstream shopnow_cluster {
        # Algoritmo 1 (Ativo por padrao): Round Robin
        # Algoritmo 2 (Alternativo): descomente a diretiva abaixo para Least Connections
        # least_conn;

        # Algoritmo 3 (Alternativo): descomente para IP Hash
        # ip_hash;

        server app_server1:8001 weight=1 max_fails=2 fail_timeout=5s;
        server app_server2:8002 weight=1 max_fails=2 fail_timeout=5s;
        server app_server3:8003 weight=1 max_fails=2 fail_timeout=5s;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://shopnow_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Load-Balancer-Algorithm "Nginx Proxy (Round Robin / Least Conn)";

            # Failover automatico caso uma instancia apresente erro ou timeout
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        }
    }
}
